# GitOps illustrative desired state: requires a built image, registry and Kubernetes cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uberfare-inference
spec:
  replicas: 2
  selector:
    matchLabels: {app: uberfare-inference}
  template:
    metadata:
      labels: {app: uberfare-inference}
    spec:
      containers:
        - name: api
          image: registry.example.com/uberfare-api:1.0.0
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: '100m', memory: '256Mi'}
            limits: {cpu: '500m', memory: '512Mi'}
